<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nomada Holding Group · Tech — Realidad Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  /* ─── Reset / base ─────────────────────────────────────── */
  *,*::before,*::after{ box-sizing:border-box }
  html,body{ margin:0; padding:0; min-height:100% }
  img{ display:block; max-width:100%; height:auto }
  a{ color:inherit; text-decoration:none }
  button{ font:inherit; cursor:pointer }

  :root{
    --brand-blue:#1E8AC8;
    --brand-blue-dark:#1773A8;
    --brand-blue-soft:#E8F4FB;
    --ink:#1a1a1a;
    --ink-soft:#2a2a2a;
    --paper:#ffffff;
    --muted:#8a8a8a;
    --line:rgba(0,0,0,.08);

    --font-display:"Avenir Next","Avenir","Rubik","Helvetica Neue",Arial,sans-serif;
    --font-body:"Avenir Next","Avenir","Rubik","Helvetica Neue",Arial,sans-serif;

    --nav-h: 92px;
    --side-w: clamp(220px, 19vw, 260px);
  }

  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  /* ════════════════════════════════════════════════════════
     NAVBAR (constante en todas las páginas)
     ════════════════════════════════════════════════════════ */
  .nav{
    position: sticky;
    top: 0;
    z-index: 30;
    height: var(--nav-h);
    background: #fff;
    display:flex;
    align-items:center;
    padding: 0 clamp(24px, 3vw, 56px);
    gap: clamp(16px, 2vw, 32px);
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .nav.is-stuck{
    border-bottom-color: var(--line);
    box-shadow: 0 2px 18px -10px rgba(0,0,0,.08);
  }
  .nav .logo{
    width: clamp(200px, 20vw, 280px);
    height:auto;
    flex-shrink:0;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: clamp(18px, 2.2vw, 38px);
    margin-left: auto;
  }
  .nav-links a{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--brand-blue);
    text-transform: uppercase;
    padding: 6px 2px;
    position: relative;
    transition: color .2s ease;
  }
  .nav-links a::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px;
    height:1.5px; background: var(--brand-blue);
    transform: scaleX(0); transform-origin: left;
    transition: transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .nav-links a:hover::after,
  .nav-links a.is-active::after{ transform: scaleX(1) }
  .nav-links a.is-active{ color: var(--brand-blue-dark) }

  .nav-right{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-left: clamp(18px, 2.2vw, 32px);
  }
  .nav-right .lang{
    width:28px;height:28px;
    color: var(--brand-blue);
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    transition: background .2s ease;
  }
  .nav-right .lang:hover{ background: var(--brand-blue-soft) }
  .nav-right .lang svg{ width:22px; height:22px }

  .nav-right .flags{
    display:flex; align-items:center; gap:6px;
  }
  .flag-btn{
    width: 38px; height: 24px;
    border:1.2px solid transparent;
    border-radius: 3px;
    overflow:hidden;
    padding:0;
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s ease, transform .2s ease;
  }
  .flag-btn:hover{ transform: translateY(-1px) }
  .flag-btn.is-active{ border-color: var(--brand-blue) }
  .flag-btn img{ width: 100%; height: 100%; object-fit: contain }

  /* ════════════════════════════════════════════════════════
     LAYOUT principal
     ════════════════════════════════════════════════════════ */
  .shell{
    display:grid;
    grid-template-columns: var(--side-w) minmax(0, 1fr) minmax(0, 1.25fr);
    grid-template-areas:
      "side subnav subnav"
      "side center right";
    column-gap: clamp(24px, 3vw, 56px);
    row-gap: clamp(14px, 1.6vh, 22px);
    padding: clamp(20px, 3vw, 48px) clamp(24px, 3vw, 56px) clamp(24px, 4vw, 64px);
    min-height: calc(100vh - var(--nav-h));
    position: relative;
  }
  .side    { grid-area: side; }
  .subnav  { grid-area: subnav; }
  .center  { grid-area: center; }
  .right   { grid-area: right; }

  /* ─── Continent backdrop (dotted map, right side) ──────── */
  .continent{
    position: absolute;
    top: 0;
    right: 0;
    width: 56%;
    height: 100%;
    background-image: url('assets/continente-puntos.png');
    background-repeat: no-repeat;
    background-position: top right;
    background-size: contain;
    opacity: .55;
    pointer-events: none;
    z-index: 0;
    mask-image: linear-gradient(to bottom, #000 0%, #000 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 75%, transparent 100%);
  }

  /* ════════════════════════════════════════════════════════
     LEFT SIDEBAR — ODS + 7 unidades
     ════════════════════════════════════════════════════════ */
  .side{
    position: relative;
    z-index: 2;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .ods{
    display:flex;
    flex-direction:column;
    gap: 2px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .ods .ods-label{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -.01em;
    color: var(--brand-blue);
    text-transform: uppercase;
  }
  .ods .ods-label span{ display:block }
  .ods .ods-label span:nth-child(1){ color: var(--brand-blue) }
  .ods .ods-label span:nth-child(2){ color: #2BA3DC }
  .ods .ods-label span:nth-child(3){ color: #5AB7DF; letter-spacing: -.02em; font-size: 18px }

  /* Stacked unit buttons */
  .units{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .ods-logo{
    padding-top: 12px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ods-logo img{
    width: 100%;
    height: auto;
    max-width: 140px;
  }

  .unit-btn{
    appearance:none;
    background: #fff;
    border: 1.5px solid var(--brand-blue);
    color: var(--brand-blue);
    border-radius: 10px;
    padding: 12px 18px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-align:center;
    transition: all .2s cubic-bezier(.2,.7,.2,1);
    position: relative;
    overflow: hidden;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
  }
  .unit-btn:hover{
    background: var(--brand-blue);
    color: #fff;
    transform: translateX(4px);
    box-shadow: 0 14px 28px -16px rgba(30,138,200,.55);
  }
  .unit-btn .arrow{
    position: absolute;
    right: 16px;
    top: 50%;
    opacity:0;
    transform: translate(-4px, -50%);
    transition: all .2s ease;
    font-size: 14px;
    line-height: 1;
  }
  .unit-btn:hover .arrow{ opacity:1; transform: translate(0, -50%) }
  .unit-btn.is-active{
    background: var(--brand-blue);
    color: #fff;
  }

  /* Staggered entry */
  .unit-btn{ animation: slideIn .5s backwards ease-out }
  .unit-btn:nth-child(1){ animation-delay: .05s }
  .unit-btn:nth-child(2){ animation-delay: .10s }
  .unit-btn:nth-child(3){ animation-delay: .15s }
  .unit-btn:nth-child(4){ animation-delay: .20s }
  .unit-btn:nth-child(5){ animation-delay: .25s }
  .unit-btn:nth-child(6){ animation-delay: .30s }
  .unit-btn:nth-child(7){ animation-delay: .35s }
  @keyframes slideIn{
    from{ opacity:0; transform: translateX(-12px) }
    to  { opacity:1; transform: translateX(0) }
  }

  /* ════════════════════════════════════════════════════════
     CENTER — Headline + paragraph
     ════════════════════════════════════════════════════════ */
  .center{
    position: relative;
    z-index: 2;
    padding-top: clamp(20px, 4vh, 60px);
    display:flex;
    flex-direction:column;
    gap: clamp(20px, 3vh, 32px);
    animation: fadeUp .8s .3s backwards ease-out;
  }
  .h-pill{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color: var(--brand-blue);
    display:inline-flex; align-items:center; gap:10px;
  }
  .h-pill::before{
    content:""; display:inline-block; width:32px; height:1.5px;
    background: var(--brand-blue);
  }
  .center h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(36px, 3.6vw, 58px);
    line-height: 1.02;
    letter-spacing: -.02em;
    color: var(--brand-blue);
    margin: 0;
    text-wrap: balance;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .center .lede{
    font-size: clamp(14px, 1.05vw, 16px);
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0;
  }
  .center .lede b{ color: var(--ink); font-weight: 700 }
  .center .lede i{ font-style: italic; color: var(--ink) }
  .center .lede--justify{
    text-align: justify;
    hyphens: auto;
    max-width: 62ch;
  }

  /* ════════════════════════════════════════════════════════
     RIGHT — Sub-nav + Hero image
     ════════════════════════════════════════════════════════ */
  .right{
    position:relative;
    z-index: 1;
    display:flex;
    flex-direction:column;
    gap: 14px;
    min-height: clamp(420px, 64vh, 720px);
  }

  /* Sub-navigation bar — process steps (spans center + right) */
  .subnav{
    position: relative;
    z-index: 3;
    background: var(--brand-blue);
    color: #fff;
    border-radius: 4px;
    padding: 10px clamp(12px, 1.2vw, 20px);
    display:flex;
    flex-wrap: nowrap;
    align-items:center;
    justify-content: space-between;
    gap: 4px 8px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(9.5px, .78vw, 11.5px);
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    animation: fadeUp .8s .25s backwards ease-out;
  }
  /* Dense variant — for subnavs with many items (e.g. Architecture) */
  .subnav--dense{
    font-size: clamp(7.5px, .62vw, 9.5px);
    letter-spacing: .03em;
    padding: 9px 10px;
    gap: 2px 4px;
    justify-content: space-between;
  }
  .subnav a{
    color:#fff;
    padding: 4px 2px;
    position:relative;
    transition: opacity .2s ease;
    white-space: nowrap;
  }
  .subnav a:hover{ opacity:.78 }
  .subnav a.is-active{
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
  }
  .subnav .sep{
    color: rgba(255,255,255,.55);
    font-weight: 400;
    user-select:none;
  }

  /* Tokens hero image */
  .tokens-hero{
    position:relative;
    width:100%;
    border-radius: 4px;
    overflow:hidden;
    background: #fff;
    aspect-ratio: 16 / 9;
    animation: fadeUp 1s .35s backwards cubic-bezier(.2,.7,.2,1);
  }
  .tokens-hero img{
    width:100%;
    height:100%;
    object-fit: contain;
    object-position: center;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* Social icons — bottom right of the right column, below image */
  .socials{
    margin-top: auto;
    align-self: flex-end;
    display:flex;
    gap: 18px;
    padding-top: 18px;
    animation: fadeUp .8s .6s backwards ease-out;
  }
  .socials a{
    width: 28px; height: 28px;
    display:flex; align-items:center; justify-content:center;
    color: var(--brand-blue);
    transition: transform .2s ease, color .2s ease;
  }
  .socials a:hover{ transform: translateY(-3px); color: var(--brand-blue-dark) }
  .socials svg{ width: 22px; height: 22px }

  /* Inline links in body copy */
  .center .lede a.inline{
    color: var(--brand-blue);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
    font-weight: 700;
    transition: color .15s ease;
  }
  .center .lede a.inline:hover{ color: var(--brand-blue-dark) }

  /* ════════════════════════════════════════════════════════
     Animations
     ════════════════════════════════════════════════════════ */
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(18px) }
    to  { opacity:1; transform: translateY(0) }
  }

  /* ════════════════════════════════════════════════════════
     Responsive
     ════════════════════════════════════════════════════════ */
  @media (max-width: 980px){
    .shell{
      grid-template-columns: 220px minmax(0,1fr);
      grid-template-areas:
        "side subnav"
        "side center"
        "side right";
      column-gap: 32px;
      row-gap: 16px;
    }
    .right{ min-height: auto }
    .subnav{ flex-wrap: wrap; white-space: normal; font-size: 11px }
    .subnav--dense{ font-size: 7.5px }
    .continent{ width: 80%; opacity:.35 }
  }
  @media (max-width: 820px){
    .nav-links{ display:none }
    .shell{
      grid-template-columns: 1fr;
      grid-template-areas:
        "side"
        "subnav"
        "center"
        "right";
      padding: 24px 20px;
      column-gap: 0;
      row-gap: 24px;
    }
    .side{ flex-direction: row; flex-wrap: wrap; align-items:flex-start }
    .ods{ flex:1 1 100%; border-bottom: none; padding-bottom: 0 }
    .units{ flex-direction: row; flex-wrap: wrap; gap: 8px; flex:1 1 100% }
    .unit-btn{ padding: 9px 14px; font-size: 11px }
    .subnav{ font-size: 10.5px }
    .subnav--dense{ font-size: 7.5px }
  }
</style>
</head>
<body>

     NAVBAR

</main>


<script>
  // Sticky nav shadow
  const nav = document.getElementById('nav');
  const onScroll = () => nav.classList.toggle('is-stuck', window.scrollY > 4);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Flag toggle — switches between Colombia and Mexico pages
  document.querySelectorAll('.flag-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.country === 'mx' ? 'mexico.html' : 'colombia.html';
      if (target === location.pathname.split('/').pop()) return;
      navigateOrFlash(btn, target);
    });
  });

  // Nav links + unit buttons: graceful "Próximamente" when target missing
  document.querySelectorAll('[data-target]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const target = btn.dataset.target;
      if (!target) return;
      // If this is the active page, no-op
      if (target === location.pathname.split('/').pop()) { e.preventDefault(); return; }
      e.preventDefault();
      navigateOrFlash(btn, target);
    });
  });
  function navigateOrFlash(btn, target){
    fetch(target, { method:'GET', cache:'no-store' }).then(r => {
      if (r.ok){ window.location.href = target; }
      else { flashSoon(btn); }
    }).catch(() => { window.location.href = target; });
  }
  function flashSoon(btn){
    const txt = btn.querySelector('.label') || btn;
    const original = btn.dataset.lbl || btn.textContent.trim();
    btn.dataset.lbl = original;
    btn.dataset.flashing = '1';
    btn.classList.add('is-flashing');
    const labelNode = [...btn.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    if (labelNode) labelNode.textContent = ' Próximamente ';
    setTimeout(() => {
      if (labelNode) labelNode.textContent = ' ' + original.replace(/→/,'').trim() + ' ';
      btn.classList.remove('is-flashing');
      delete btn.dataset.flashing;
    }, 1500);
  }
</script>
</body>
</html>
